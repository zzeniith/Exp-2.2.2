<!DOCTYPE html>
<html>
<body>

<h2>Bank Login</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="getBalance()">Check Balance</button>

<script>
let token = "";

// Register
async function register() {
  await fetch("https://exp-2-2-2-6fbn.onrender.com//register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  });
  alert("Registered!");
}

// Login
async function login() {
  const res = await fetch("https://exp-2-2-2-6fbn.onrender.com//login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  });

  const data = await res.json();
  token = data.token;

  alert("Logged in!");
}

// Get Balance
async function getBalance() {
  const res = await fetch("https://exp-2-2-2-6fbn.onrender.com//balance", {
    headers: {
      "Authorization": token
    }
  });

  const data = await res.json();
  alert("Balance: " + data.balance);
}
</script>

</body>
</html>
